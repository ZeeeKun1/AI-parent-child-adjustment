<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob:; media-src 'self' blob:; connect-src 'self' ws: wss:; worker-src 'self' blob:">
    <title>亲子共调节实时采集</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <main>
      <p class="eyebrow">REALTIME CAPTURE</p>
      <h1>亲子共调节实时采集</h1>
      <p class="lede">页面只在您明确允许后使用摄像头和麦克风。默认只保存采集状态、时间和数量，不保存可回放的原始音视频。</p>

      <section class="grid" aria-label="实时采集控制">
        <article class="card preview-wrap">
          <video id="preview" muted playsinline aria-label="本地摄像头预览"></video>
        </article>

        <aside class="card panel">
          <h2>开始前确认</h2>
          <div class="notice">请确认摄像头能看到实验互动区域，麦克风能够同时听到家长和儿童。采集期间请保持本页面打开。</div>
          <label class="consent">
            <input id="consent" type="checkbox">
            <span>我已理解本次采集会使用摄像头和麦克风，并愿意开始本次技术测试。</span>
          </label>
          <label class="access-code">
            <span>实验访问码</span>
            <input id="access-code" type="password" autocomplete="one-time-code" placeholder="由研究人员提供">
          </label>
          <div class="actions">
            <button id="start-button" type="button">开始采集</button>
            <button id="stop-button" type="button" disabled>结束采集</button>
          </div>
          <p id="status" role="status" aria-live="polite">等待开始。</p>
          <div class="metrics" aria-label="实时采集指标">
            <div class="metric"><span>音频块</span><strong id="audio-count">0</strong></div>
            <div class="metric"><span>图像帧</span><strong id="image-count">0</strong></div>
            <div class="metric"><span>已采集</span><strong id="elapsed">0 ms</strong></div>
          </div>
          <p class="session-line">本次技术会话：<span id="session-code"></span></p>
          <p id="summary" hidden></p>
        </aside>
      </section>
    </main>
    <script src="/static/app.js" defer></script>
  </body>
</html>
