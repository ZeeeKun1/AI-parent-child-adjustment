version: 1
source:
  - "Formative study section 3.4.1: intervention timing depends on dyadic co-regulation state"
  - "Formative study section 3.4.2: experts use multiple cues and whole context"
  - "Three-stage thematic analysis: antecedents, trigger cues, intervention targets, strategies and consequences"

research_basis:
  timing_by_state: >-
    The third party should intervene according to whether the dyad can maintain or
    restore co-regulation, rather than in response to one isolated negative signal.
  protect_natural_rhythm: >-
    When interaction remains coordinated or can recover, avoid interrupting the
    dyad's communication and the child's task attention.
  observe_consequences: >-
    After an intervention, observe the dyad's response and task progression before
    making another intervention decision.
  high_risk_requires_history: >-
    High risk describes a persistent controlling-dependent pattern or sustained
    strong task resistance and cannot be inferred from one isolated observation.
  post_intervention_response_timeout: >-
    If the dyad does not produce an observable response after repeated assessments,
    the system must re-evaluate the current state rather than wait indefinitely.
  reinforce_positive_coordination: >-
    Positive reinforcement may maintain a constructive interaction loop, but it
    should be used only after an observable positive event or self-recovery and at
    a natural pause so that it does not become continuous praise or interruption.

principles:
  use_hard_time_or_count_thresholds: false
  use_single_signal_as_trigger: false
  require_natural_turn_boundary_for_intervention: true
  require_post_intervention_response_before_repeat: true
  post_intervention_max_wait_count: 3
  low_confidence_action: hold
  insufficient_evidence_action: hold
  post_intervention_full_window_required: true
  fluctuation_is_non_intervention: true
  fluctuation_no_reinforcement: true

guard_actions:
  insufficient_evidence:
    action: hold
    reason_code: insufficient_evidence
    research_basis: [timing_by_state]
    rationale: >-
      Observable evidence is insufficient, so the system preserves the interaction
      and makes no intervention claim.
  low_confidence:
    action: hold
    reason_code: low_confidence
    research_basis: [timing_by_state, protect_natural_rhythm]
    rationale: >-
      The state estimate is low confidence, so the system does not interrupt the dyad.
  waiting_for_natural_turn_boundary:
    action: hold
    reason_code: waiting_for_natural_turn_boundary
    research_basis: [protect_natural_rhythm]
    rationale: >-
      Intervention is warranted by state but is held until a natural turn boundary
      to avoid interrupting active parent-child communication.
  waiting_for_post_intervention_response:
    action: hold
    reason_code: waiting_for_post_intervention_response
    research_basis: [observe_consequences]
    rationale: >-
      A prior intervention is awaiting an observable dyadic response, so another
      intervention is not issued yet.
  history_required:
    action: hold
    reason_code: history_required
    research_basis: [high_risk_requires_history]
    rationale: >-
      High-risk classification requires interaction history and cannot trigger a
      progressive support path from one isolated observation.
  support_need_not_identified:
    action: hold
    reason_code: support_need_not_identified
    research_basis: [timing_by_state]
    rationale: >-
      The type of support needed is not identified or unclear, so the system
      cannot select an appropriate strategy and holds.
  support_target_unidentified:
    action: hold
    reason_code: support_target_unidentified
    research_basis: [timing_by_state]
    rationale: >-
      The support target cannot be identified from evidence, so the system
      cannot direct intervention and holds.

positive_maintenance:
  action: reinforce
  reason_code: positive_maintenance_opportunity
  allowed_states: [normal]
  explicit_trigger_performances:
    - "task completion"
    - "positive dyadic exchange"
    - "active child participation"
    - "supportive parental guidance"
    - "normal task progression"
  recovery_transition_states: [fluctuation]
  requires_natural_turn_boundary: true
  research_basis: [protect_natural_rhythm, reinforce_positive_coordination]
  rationale: >-
    A clearly positive event or self-recovery provides a bounded opportunity to
    reinforce effective coordination without turning normal activity into constant
    system intervention.

state_actions:
  normal:
    action: no_intervention
    reason_code: normal_coordination
    requires_natural_turn_boundary: false
    history_required: false
    research_basis: [timing_by_state, protect_natural_rhythm]
    rationale: >-
      The dyad is coordinating around the homework task, so the system does not
      interrupt the interaction.
  fluctuation:
    action: no_intervention
    reason_code: self_recovery_possible
    requires_natural_turn_boundary: false
    history_required: false
    research_basis: [timing_by_state, protect_natural_rhythm]
    rationale: >-
      Coordination is temporarily uneven, but the dyad retains capacity to recover
      without third-party intervention. The system observes without intervening.
  dysregulation:
    action: intervene
    reason_code: dyad_cannot_self_recover
    requires_natural_turn_boundary: true
    history_required: false
    research_basis: [timing_by_state, protect_natural_rhythm, observe_consequences]
    rationale: >-
      The dyad cannot restore effective interaction on its own and explicit
      intervention is warranted at a natural turn boundary.
  high_risk:
    action: progressive_support
    reason_code: persistent_high_risk_pattern
    requires_natural_turn_boundary: true
    history_required: true
    research_basis:
      - timing_by_state
      - protect_natural_rhythm
      - observe_consequences
      - high_risk_requires_history
    rationale: >-
      A persistent controlling-dependent or sustained resistance pattern requires
      a progressive support path rather than a one-off prompt.
