version: 3
source: "Formative study: 63 WOZ intervention episodes and expert interviews"

classification_principles:
  boundary_basis: "Three-stage thematic analysis and formative study"
  use_data_derived_operational_thresholds: true
  thresholds_require_corroborating_evidence: true
  assess_whole_sequence: true
  preserve_boundary_uncertainty: true
  allow_alternative_state: true
  guidance: >-
    Classify dynamic interaction patterns from the observed trajectory rather than
    from one isolated error, utterance, gesture, duration threshold, or event count.

operational_boundary:
  source: "Data-derived temporal, behavioral, and dyadic boundary table"
  expected_window_ms: 10000
  fluctuation_stagnation_minimum_ms: 10000
  dysregulation_stagnation_minimum_ms: 30000
  spontaneous_recovery_window_ms: 30000
  parental_prompt_rate_window_ms: 60000
  high_parental_prompt_rate_per_minute_exclusive: 4.0
  required_corroborating_signal_count: 1
  corroborating_signals:
    - "high_parental_prompt_rate"
    - "conflict_action"
    - "child_disengagement"
    - "both_crossed"
  guidance: >-
    A continuously observed task stall between 10 and 30 seconds supports
    fluctuation when one participant remains stable. A continuously observed stall
    of at least 30 seconds supports dysregulation only when self-recovery is not
    observed and at least one corroborating signal is present. A return to effective
    task progress within 30 seconds is recorded as spontaneous recovery. Absolute
    sound-pressure, numeric pose-angle, and numeric gaze thresholds are deferred
    until the live measurement pipeline uses the same calibrated measurement
    protocol as the source data.

decision_dimensions:
  coordination_disruption:
    values: [none, mild, marked]
  recovery_capacity:
    values: [spontaneous, prompted_within_dyad, not_observed]
  persistence:
    values: [isolated, repeated, sustained]
  task_engagement:
    values: [maintained, variable, disengaged]
  interaction_balance:
    values: [balanced, temporarily_uneven, persistently_imbalanced]

boundary_guidance:
  normal_vs_fluctuation: >-
    An isolated wrong answer followed by smooth, supportive correction can remain
    normal. Fluctuation requires observable temporarily uneven coordination across
    the sequence while the dyad still retains recovery capacity. When both remain
    plausible, report confidence, alternative_state, and ambiguity_reason.

intervention_policy:
  classification_is_separate_from_action: true
  no_intervention_states: [normal, fluctuation]
  other_states_require_separate_intervention_policy: true

states:
  normal:
    label: "Normal"
    definition: >-
      Both participants respond to one another, adjust their pace, and continue
      effective interaction around the homework task.
    interaction_performance:
      - "normal task progression"
      - "active child participation"
      - "supportive parental guidance"
      - "task completion"
      - "positive dyadic exchange"
    history_required: false

  fluctuation:
    label: "Fluctuation"
    definition: >-
      Coordination becomes temporarily uneven during a 10-to-30-second task stall,
      but at least one participant remains stable and the dyad retains the capacity
      to recover without intervention.
    interaction_performance:
      - "brief task stall"
      - "child comprehension difficulty"
      - "mild parental prompting"
      - "temporarily insufficient instructional support"
    history_required: false

  dysregulation:
    label: "Dysregulation"
    definition: >-
      A task stall has persisted for at least 30 seconds without spontaneous
      recovery, and the sequence contains corroborating evidence such as high-rate
      parental prompting, child disengagement, conflict action, or both participants
      crossing the regulation boundary.
    interaction_performance:
      - "sustained task stall"
      - "pace conflict"
      - "misaligned understanding"
      - "escalating negative interaction"
    history_required: false

  high_risk:
    label: "High risk"
    definition: >-
      The dyad shows a persistent controlling-dependent pattern or sustained,
      intense task resistance that short-term support is unlikely to change.
    interaction_performance:
      - "persistent interaction imbalance"
      - "parental over-helping or task takeover"
      - "child passive dependence"
      - "sustained strong resistance or withdrawal"
    history_required: true

evidence_policy:
  require_timestamp: true
  require_observable_source: true
  allow_insufficient_evidence: true
  assess_modalities_independently: true
  require_both_modalities: false
  audio_quote_required: true
  video_direct_observation_required: true
  insufficient_modality_must_be_reported: true
  unknown_actor_allowed_when_speaker_binding_is_unavailable: true
  prohibited_inferences:
    - "diagnosis from a single behavior"
    - "emotion labels without observable support"
    - "high-risk classification from one isolated turn"
