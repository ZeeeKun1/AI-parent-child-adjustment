version: 6
source: "Formative study: 63 WOZ intervention episodes and expert interviews"

classification_principles:
  boundary_basis: "Three-stage thematic analysis and formative study"
  use_data_derived_operational_thresholds: true
  thresholds_require_corroborating_evidence: true
  assess_whole_sequence: true
  preserve_boundary_uncertainty: true
  allow_alternative_state: true
  guidance: >-
    Classify dynamic interaction patterns from the observed trajectory rather than
    from one isolated error, utterance, gesture, duration threshold, or event count.

operational_boundary:
  source: "Data-derived temporal, behavioral, and dyadic boundary table"
  expected_window_ms: 10000
  fluctuation_stagnation_minimum_ms: 10000
  dysregulation_stagnation_minimum_ms: 30000
  spontaneous_recovery_window_ms: 30000
  trajectory_window_ms: 60000
  recovery_confirmation_ms: 20000
  uncertain_evidence_retention_ms: 30000
  parental_prompt_rate_window_ms: 60000
  parental_prompt_rate_minimum_observation_ms: 30000
  high_parental_prompt_rate_per_minute_exclusive: 4.0
  required_disruption_window_count: 3
  required_consecutive_disruption_window_count: 2
  required_corroborating_signal_count: 1
  high_risk_pattern_window_ms: 60000
  high_risk_parent_takeover_minimum_windows: 2
  high_risk_passive_dependence_minimum_windows: 2
  high_risk_resistance_minimum_windows: 2
  high_risk_refractory_dysregulation_ms: 120000
  high_risk_refractory_task_processes:
    - "over_assistance"
    - "disengaged"
    - "sustained_stall"
  model_dysregulation_requires_operational_confirmation: true
  allow_immediate_dysregulation_for_marked_current_evidence: true
  marked_current_evidence_requires_independent_corroboration: true
  coordination_disruption_task_processes:
    - "sustained_stall"
    - "pace_mismatch"
    - "explanation_mismatch"
    - "over_assistance"
    - "disengaged"
  coordination_disruption_performances:
    - "sustained task stall"
    - "pace conflict"
    - "misaligned understanding"
    - "escalating negative interaction"
    - "persistent interaction imbalance"
    - "parental over-helping or task takeover"
    - "child passive dependence"
    - "sustained strong resistance or withdrawal"
  explicit_recovery_task_processes:
    - "smooth_progress"
    - "completion"
  corroborating_signals:
    - "high_parental_prompt_rate"
    - "conflict_action"
    - "child_disengagement"
    - "both_crossed"
  guidance: >-
    Ten to 30 seconds of observed coordination disruption supports fluctuation.
    Within a rolling 60-second trajectory, dysregulation requires at least three
    disrupted windows, including at least two consecutive windows, at least 30 seconds
    of disruption, and at least one independent corroborating signal. The disrupted
    task trajectory is one dimension; high parental prompting, child disengagement,
    conflict action, or both actors crossing their regulation boundary supplies a
    second dimension. Gaze aversion, silence, compliance, or one transcribed word cannot independently
    establish dysregulation. Marked current evidence can support immediate
    dysregulation only when it is repeated, cross-actor, or independently corroborated
    across modalities. One stable window moves an active dysregulation episode into
    provisional fluctuation; at least 20 seconds of effective progress with restored
    dyadic balance confirms normal recovery and clears the episode. An uncertain
    window neither adds duration nor erases prior valid evidence; the unresolved
    candidate expires after the existing 30-second uncertainty window. Absolute
    sound-pressure, numeric
    pose-angle, and numeric gaze thresholds are deferred until the live measurement
    pipeline uses the same calibrated measurement protocol as the source data.
    High risk is promoted deterministically when repeated parent task takeover and
    child passive dependence are both present in the recent 60-second history, or
    when dysregulation has persisted for at least 120 seconds, a delivered support
    attempt was not effective, and a current high-risk signal or refractory task
    process remains observable. High-risk escalation is never based on duration alone.

decision_dimensions:
  coordination_disruption:
    values: [none, mild, marked]
  recovery_capacity:
    values: [spontaneous, prompted_within_dyad, not_observed]
  persistence:
    values: [isolated, repeated, sustained]
  task_engagement:
    values: [maintained, variable, disengaged]
  interaction_balance:
    values: [balanced, temporarily_uneven, persistently_imbalanced]

boundary_guidance:
  normal_vs_fluctuation: >-
    An isolated wrong answer followed by smooth, supportive correction can remain
    normal. Fluctuation requires observable temporarily uneven coordination across
    the sequence while the dyad still retains recovery capacity. When both remain
    plausible, report confidence, alternative_state, and ambiguity_reason.

intervention_policy:
  classification_is_separate_from_action: true
  no_intervention_states: [normal, fluctuation]
  other_states_require_separate_intervention_policy: true

states:
  normal:
    label: "Normal"
    definition: >-
      Both participants respond to one another, adjust their pace, and continue
      effective interaction around the homework task.
    interaction_performance:
      - "normal task progression"
      - "active child participation"
      - "supportive parental guidance"
      - "task completion"
      - "positive dyadic exchange"
    history_required: false

  fluctuation:
    label: "Fluctuation"
    definition: >-
      Coordination becomes temporarily uneven during a 10-to-30-second task stall,
      but the sequence contains observable evidence of recovery capacity. Continued
      compliance or looking at the task alone does not establish recovery.
    interaction_performance:
      - "brief task stall"
      - "child comprehension difficulty"
      - "mild parental prompting"
      - "temporarily insufficient instructional support"
    history_required: false

  dysregulation:
    label: "Dysregulation"
    definition: >-
      Coordination disruption is sustained or repeatedly returns within the recent
      trajectory without confirmed recovery. The disruption must be supported by
      evidence from more than one dimension, such as parental pressure together with
      child withdrawal, task stoppage together with an unresolved understanding
      mismatch, or a marked conflict with an observable counterpart response. A child
      may still answer or comply while the dyad is dysregulated, but passive compliance
      alone is not evidence of dysregulation.
    interaction_performance:
      - "sustained task stall"
      - "pace conflict"
      - "misaligned understanding"
      - "escalating negative interaction"
    history_required: false

  high_risk:
    label: "High risk"
    definition: >-
      The dyad shows a persistent controlling-dependent pattern or sustained,
      intense task resistance that short-term support is unlikely to change.
    interaction_performance:
      - "persistent interaction imbalance"
      - "parental over-helping or task takeover"
      - "child passive dependence"
      - "sustained strong resistance or withdrawal"
    history_required: true

evidence_policy:
  require_timestamp: true
  require_observable_source: true
  allow_insufficient_evidence: true
  assess_modalities_independently: true
  require_both_modalities: false
  audio_quote_required: true
  video_direct_observation_required: true
  insufficient_modality_must_be_reported: true
  unknown_actor_allowed_when_speaker_binding_is_unavailable: true
  prohibited_inferences:
    - "diagnosis from a single behavior"
    - "emotion labels without observable support"
    - "high-risk classification from one isolated turn"
