version: 5
source:
  - "三阶段主题分析3.0：专家干预策略类别、适用状态与干预对象（二级code实例拆分为单方卡）"
  - "形成性研究3.4.3：干预应根据亲子共调节状态匹配策略"
  - "WOZ后果编码：家长调整、儿童重新参与、任务继续推进与亲子关系缓和"
  - "混合策略选择：规则执行干预授权与状态安全边界，受限大模型在批准策略卡中进行语义排序并生成情境化话术"

principles:
  module_two_authorization_required: true
  normal_requires_positive_maintenance_authorization: true
  target_actor_must_be_explicit: true
  one_card_one_primary_action: true
  llm_generates_contextual_message: true
  llm_strategy_selection_is_bounded: true
  llm_cannot_create_strategy_cards: true
  approved_template_fallback_required: false
  do_not_repeat_before_observing_response: true
  maximum_message_characters: 90
  maximum_message_sentences: 2

banned_phrases:
  - "孩子就是"
  - "孩子在故意"
  - "家长错了"
  - "你错了"
  - "你应该反思"
  - "你必须道歉"
  - "答案是"

outcome_mapping:
  recovered:
    - "家长调整"
    - "儿童重新参与"
    - "任务继续推进"
    - "亲子关系缓和"
  partial_recovery:
    - "短暂配合"
    - "单方回应"
    - "需求表达但未解决"
    - "任务转换但问题未完全解决"
  not_recovered:
    - "无回应"
    - "原互动模式延续"
  deteriorated:
    - "抵触或拒绝增加"
    - "情绪或冲突升级"
  indeterminate:
    - "干预后可观察证据不足"

routing_rules:
  - state: "normal"
    interaction_performance: "normal task progression"
    strategy_ids: ["DYAD_POSITIVE_AFFIRM"]
  - state: "normal"
    interaction_performance: "active child participation"
    strategy_ids: ["CHILD_POSITIVE_AFFIRM", "DYAD_POSITIVE_AFFIRM"]
  - state: "normal"
    interaction_performance: "supportive parental guidance"
    strategy_ids: ["PARENT_POSITIVE_AFFIRM", "DYAD_POSITIVE_AFFIRM"]
  - state: "normal"
    interaction_performance: "task completion"
    strategy_ids: ["DYAD_POSITIVE_AFFIRM", "CHILD_POSITIVE_AFFIRM", "PARENT_POSITIVE_AFFIRM"]
  - state: "normal"
    interaction_performance: "positive dyadic exchange"
    strategy_ids: ["DYAD_POSITIVE_AFFIRM"]
  - state: "dysregulation"
    interaction_performance: "escalating negative interaction"
    strategy_ids: ["DYAD_RELATIONSHIP_RESET", "CHILD_AFFECT_SOOTHE", "PARENT_TONE_AND_PACE", "PARENT_CAREGIVER_EMPATHY"]
  - state: "dysregulation"
    interaction_performance: "pace conflict"
    strategy_ids: ["PARENT_TONE_AND_PACE", "CHILD_PACE_RESET", "PARENT_PACE_RESET"]
  - state: "dysregulation"
    interaction_performance: "misaligned understanding"
    strategy_ids: ["DYAD_RELATIONSHIP_RESET", "CHILD_INTENT_TRANSLATION", "PARENT_INTENT_TRANSLATION", "CHILD_NEEDS_INQUIRY"]
  - state: "dysregulation"
    interaction_performance: "sustained task stall"
    strategy_ids: ["CHILD_NEEDS_INQUIRY", "PARENT_SCAFFOLD_CHANGE", "CHILD_STRATEGY_SUPPORT"]
  - state: "high_risk"
    interaction_performance: "sustained strong resistance or withdrawal"
    strategy_ids: ["CHILD_PACE_RESET", "CHILD_NEEDS_INQUIRY"]
  - state: "high_risk"
    interaction_performance: "parental over-helping or task takeover"
    strategy_ids: ["PARENT_AUTONOMY_SPACE", "PARENT_BOUNDARY_SET"]
  - state: "high_risk"
    interaction_performance: "child passive dependence"
    strategy_ids: ["CHILD_AUTONOMY_SPACE", "PARENT_AUTONOMY_SPACE"]
  - state: "high_risk"
    interaction_performance: "persistent interaction imbalance"
    strategy_ids: ["PARENT_AUTONOMY_SPACE", "PARENT_BOUNDARY_SET"]

cards:
  - strategy_id: "DYAD_POSITIVE_AFFIRM"
    name: "双方正向强化"
    states: ["normal"]
    target_actor: "both"
    repair_target: "positive_reinforcement"
    strategy_family: "positive_affirmation"
    support_needs: ["positive_reinforcement"]
    task_processes: ["smooth_progress", "completion"]
    approved_action_clause: "你们刚才一起把节奏调整好了，可以继续保持现在这种配合。"
    priority: 0
    use_when:
      - "双方完成任务、恢复协调或出现明确的积极互动"
      - "需要巩固双方共同形成的积极互动回路"
    avoid_when:
      - "只是一般性顺利推进，没有新的积极事件"
    action: "具体指出双方刚刚共同完成的积极行为，并邀请保持当前方式"
    approved_template: "你们刚才一起把节奏调整好了，可以继续保持现在这种配合。"
    expected_recovery:
      - "双方保持积极互动"
      - "任务继续推进"
    research_codes:
      - "正向强化与平衡维护"

  - strategy_id: "DYAD_RELATIONSHIP_RESET"
    name: "双方理解重置"
    states: ["dysregulation", "high_risk"]
    target_actor: "both"
    repair_target: "relationship_repair"
    strategy_family: "relationship_repair"
    support_needs: ["mutual_understanding"]
    task_processes: ["explanation_mismatch"]
    approved_action_clause: "我们先不判断谁对谁错。孩子先说一个卡住的地方，家长听完再回应。"
    priority: 0
    use_when:
      - "双方出现误解、责备或正在升级的负向互动"
      - "现有证据只能支持双方互动失配，不能可靠归因到单方"
    avoid_when:
      - "能够明确识别由某一方发起且适合单方支持"
    action: "在自然停顿处暂停归因，让儿童先说明一个困难，再由家长回应"
    approved_template: "我们先不判断谁对谁错。孩子先说一个卡住的地方，家长听完再回应。"
    expected_recovery:
      - "双方减少负面归因"
      - "儿童表达具体困难"
      - "家长开始回应需要"
    research_codes:
      - "亲子互相理解与关系修复"

  - strategy_id: "CHILD_POSITIVE_AFFIRM"
    name: "儿童正向肯定"
    states: ["normal", "fluctuation"]
    target_actor: "child"
    repair_target: "positive_reinforcement"
    strategy_family: "positive_affirmation"
    support_needs: ["positive_reinforcement"]
    task_processes: ["smooth_progress", "completion"]
    approved_action_clause: "你刚才做得很好，继续保持这个节奏就好。"
    priority: 0
    use_when:
      - "任务顺利推进或儿童积极尝试"
      - "需要巩固积极反馈回路"
    avoid_when:
      - "儿童已经因过度表扬而分散注意力"
    action: "肯定儿童当前表现或努力，鼓励继续"
    approved_template: "你刚才做得很好，继续保持这个节奏就好。"
    expected_recovery:
      - "儿童保持参与积极性"
      - "任务持续推进"
    research_codes:
      - "正向肯定与鼓励"

  - strategy_id: "PARENT_POSITIVE_AFFIRM"
    name: "家长正向肯定"
    states: ["normal", "fluctuation"]
    target_actor: "parent"
    repair_target: "positive_reinforcement"
    strategy_family: "positive_affirmation"
    support_needs: ["positive_reinforcement"]
    task_processes: ["smooth_progress", "completion"]
    approved_action_clause: "您的耐心讲解很有帮助，可以继续这样的方式。"
    priority: 0
    use_when:
      - "家长耐心讲解且互动顺畅"
      - "需要巩固家长当前辅导方式"
    avoid_when:
      - "家长已经因表扬而放松对任务节奏的关注"
    action: "肯定家长耐心讲解，鼓励继续当前方式"
    approved_template: "您的耐心讲解很有帮助，可以继续这样的方式。"
    expected_recovery:
      - "家长维持当前辅导节奏"
      - "互动保持协调"
    research_codes:
      - "正向肯定与鼓励"

  - strategy_id: "PARENT_TONE_AND_PACE"
    name: "家长语气与节奏调节"
    states: ["fluctuation", "dysregulation"]
    target_actor: "parent"
    repair_target: "parent_regulation"
    strategy_family: "tone_adjustment"
    support_needs: ["emotional_support"]
    task_processes: ["pace_mismatch"]
    approved_action_clause: "可以先放慢语速，只保留一个问题，给孩子一些思考时间。"
    priority: 0
    use_when:
      - "家长持续催促、语速加快或密集追问"
      - "儿童思考和回应空间被压缩"
    avoid_when:
      - "家长已经主动放慢并等待儿童表达"
    action: "建议家长降低表达密度，只保留一个问题并等待"
    approved_template: "可以先放慢语速，只保留一个问题，给孩子一些思考时间。"
    expected_recovery:
      - "家长语气或语速放缓"
      - "连续催促和密集提问减少"
      - "儿童获得回应空间"
    research_codes:
      - "家长情绪与语气调节"

  - strategy_id: "CHILD_AFFECT_SOOTHE"
    name: "儿童压力安抚"
    states: ["fluctuation", "dysregulation"]
    target_actor: "child"
    repair_target: "child_support"
    strategy_family: "emotional_soothing"
    support_needs: ["emotional_support"]
    task_processes: ["sustained_stall", "disengaged"]
    approved_action_clause: "这一步现在有些困难，我们先不着急。你可以告诉家长，哪里最需要帮助。"
    priority: 0
    use_when:
      - "儿童明确表达紧张、疲惫或挫败"
      - "任务压力已经影响继续参与"
    avoid_when:
      - "没有儿童直接言语或可见行为证据"
    action: "确认当前困难并邀请儿童表达一个具体需要"
    approved_template: "这一步现在有些困难，我们先不着急。你可以告诉家长，哪里最需要帮助。"
    expected_recovery:
      - "儿童表达具体困难或需要"
      - "儿童压力性表现下降"
      - "儿童重新参与"
    research_codes:
      - "儿童情绪识别与安抚"

  - strategy_id: "CHILD_INTENT_TRANSLATION"
    name: "儿童意图理解引导"
    states: ["dysregulation"]
    target_actor: "child"
    repair_target: "relationship_repair"
    strategy_family: "resistance_understanding"
    support_needs: ["mutual_understanding"]
    task_processes: ["explanation_mismatch"]
    approved_action_clause: "家长讲这些是想帮你。你可以先说一个具体困难，让家长知道怎么帮你。"
    priority: 0
    use_when:
      - "儿童对家长辅导表现出不耐烦或对立"
      - "双方对困难原因产生误解"
    avoid_when:
      - "儿童正在直接、低压力地表达"
    action: "帮助儿童理解家长意图，引导儿童表达一个具体困难"
    approved_template: "家长讲这些是想帮你。你可以先说一个具体困难，让家长知道怎么帮你。"
    expected_recovery:
      - "儿童减少对家长的负面归因"
      - "儿童表达具体困难"
    research_codes:
      - "亲子互相理解与关系修复"

  - strategy_id: "PARENT_INTENT_TRANSLATION"
    name: "家长意图理解引导"
    states: ["dysregulation"]
    target_actor: "parent"
    repair_target: "relationship_repair"
    strategy_family: "resistance_understanding"
    support_needs: ["mutual_understanding"]
    task_processes: ["explanation_mismatch"]
    approved_action_clause: "孩子可能不是不想做，是遇到了具体困难。可以先听他说一个卡住的地方。"
    priority: 0
    use_when:
      - "家长对儿童行为产生误解或归因"
      - "沟通转向责备或对立"
    avoid_when:
      - "家长已经在低压力地倾听儿童表达"
    action: "帮助家长理解儿童可能不是不想做而是遇到困难，引导倾听"
    approved_template: "孩子可能不是不想做，是遇到了具体困难。可以先听他说一个卡住的地方。"
    expected_recovery:
      - "家长减少负面归因"
      - "家长开始回应具体需要"
    research_codes:
      - "亲子互相理解与关系修复"

  - strategy_id: "CHILD_NEEDS_INQUIRY"
    name: "儿童需求表达引导"
    states: ["dysregulation", "high_risk"]
    target_actor: "child"
    repair_target: "needs_clarification"
    strategy_family: "need_inquiry"
    support_needs: ["need_expression"]
    task_processes: ["sustained_stall", "brief_stall"]
    approved_action_clause: "我们可以先不继续做。你愿意告诉家长，现在最需要什么帮助吗？"
    priority: 0
    use_when:
      - "儿童明确说不会、不想继续或要求退出"
      - "真实困难尚不清楚"
    avoid_when:
      - "儿童正在完整表达，不应被追加提问打断"
    action: "用一个低压力问题邀请儿童说明当前需要"
    approved_template: "我们可以先不继续做。你愿意告诉家长，现在最需要什么帮助吗？"
    expected_recovery:
      - "儿童开始表达困难、疲惫或任务需要"
      - "双方获得可协商的信息"
    research_codes:
      - "需求探询与表达引导"

  - strategy_id: "PARENT_CAREGIVER_EMPATHY"
    name: "家长照护负担共情"
    states: ["fluctuation", "dysregulation", "high_risk"]
    target_actor: "parent"
    repair_target: "parent_regulation"
    strategy_family: "caregiver_empathy"
    support_needs: ["emotional_support"]
    task_processes: ["sustained_stall", "disengaged"]
    approved_action_clause: "你已经投入了很多精力。可以先停一下，把接下来缩小为一个步骤。"
    priority: 0
    use_when:
      - "家长表现出持续疲惫、无力或辅导挫败"
      - "直接建议可能引起防御"
    avoid_when:
      - "没有可观察的家长负担或挫败证据"
    action: "先承认家长的投入，再提供一个可执行的减负动作"
    approved_template: "你已经投入了很多精力。可以先停一下，把接下来缩小为一个步骤。"
    expected_recovery:
      - "家长防御性表达减少"
      - "家长愿意暂停或调整方式"
    research_codes:
      - "家长支持与照护负担共情"

  - strategy_id: "CHILD_PACE_RESET"
    name: "儿童任务节奏调节"
    states: ["dysregulation", "high_risk"]
    target_actor: "child"
    repair_target: "task_pacing"
    strategy_family: "task_pacing"
    support_needs: ["task_pacing"]
    task_processes: ["pace_mismatch"]
    approved_action_clause: "我们先休息一下，或者换一个简单的部分做。"
    priority: 0
    use_when:
      - "家长讲解频率过快，儿童跟不上"
      - "儿童出现注意力游离或脑子跟不上的反应"
    avoid_when:
      - "任务已经按照儿童可跟随的节奏推进"
    action: "建议儿童休息或换一个简单的部分做"
    approved_template: "我们先休息一下，或者换一个简单的部分做。"
    expected_recovery:
      - "儿童压力暂时缓解"
      - "儿童重新跟随任务节奏"
    research_codes:
      - "任务节奏调节"

  - strategy_id: "PARENT_PACE_RESET"
    name: "家长任务节奏调节"
    states: ["dysregulation", "high_risk"]
    target_actor: "parent"
    repair_target: "task_pacing"
    strategy_family: "task_pacing"
    support_needs: ["task_pacing"]
    task_processes: ["pace_mismatch"]
    approved_action_clause: "可以先让孩子去喝口水，降低一下当前的任务强度。"
    priority: 0
    use_when:
      - "家长持续高频催促或讲解过快"
      - "儿童来不及表达或操作"
    avoid_when:
      - "家长已经主动放慢节奏"
    action: "建议家长让孩子喝水或降低当前任务强度"
    approved_template: "可以先让孩子去喝口水，降低一下当前的任务强度。"
    expected_recovery:
      - "家长降低任务强度或节奏"
      - "儿童获得喘息空间"
    research_codes:
      - "任务节奏调节"

  - strategy_id: "CHILD_STRATEGY_SUPPORT"
    name: "儿童学习策略支持"
    states: ["dysregulation"]
    target_actor: "child"
    repair_target: "task_support"
    strategy_family: "learning_support"
    support_needs: ["learning_support"]
    task_processes: ["sustained_stall", "explanation_mismatch"]
    approved_action_clause: "你可以试着用纸演算这一步，或者换个方法检查一下。"
    priority: 0
    use_when:
      - "儿童在同一认知点反复出错"
      - "现有方法无效且儿童愿意尝试"
    avoid_when:
      - "儿童正在独立尝试且方法有效"
    action: "提供一个具体可执行的学习策略或工具"
    approved_template: "你可以试着用纸演算这一步，或者换个方法检查一下。"
    expected_recovery:
      - "儿童采用新策略推进任务"
      - "任务推进一个步骤"
    research_codes:
      - "学习策略支持"

  - strategy_id: "PARENT_SCAFFOLD_CHANGE"
    name: "家长学习策略调整"
    states: ["dysregulation"]
    target_actor: "parent"
    repair_target: "task_support"
    strategy_family: "learning_support"
    support_needs: ["learning_support"]
    task_processes: ["over_assistance", "explanation_mismatch"]
    approved_action_clause: "可以先确认孩子具体卡在哪一步，再只提供一个最小提示，不直接给答案。"
    priority: 0
    use_when:
      - "任务持续停滞且现有讲解无效"
      - "家长重复纠错或直接提供答案"
    avoid_when:
      - "儿童正在独立尝试或完整表达思路"
    action: "建议家长更换讲解思路，先定位卡点再提供最小提示"
    approved_template: "可以先确认孩子具体卡在哪一步，再只提供一个最小提示，不直接给答案。"
    expected_recovery:
      - "家长改变讲解方式"
      - "儿童表达具体困难"
      - "任务推进一个步骤"
    research_codes:
      - "学习策略支持"

  - strategy_id: "CHILD_AUTONOMY_SPACE"
    name: "儿童自主性支持"
    states: ["high_risk", "dysregulation"]
    target_actor: "child"
    repair_target: "autonomy_boundary"
    strategy_family: "autonomy_support"
    support_needs: ["autonomy_support"]
    task_processes: ["over_assistance", "disengaged"]
    approved_action_clause: "你可以先自己决定从哪一步开始试，遇到困难再请家长帮忙。"
    priority: 0
    use_when:
      - "儿童长期被动依赖，等待指令"
      - "儿童缺少独立尝试或表达空间"
    avoid_when:
      - "儿童已经获得并正在使用独立尝试空间"
    action: "通过小范围选择和可完成步骤，鼓励儿童承担学习决策"
    approved_template: "你可以先自己决定从哪一步开始试，遇到困难再请家长帮忙。"
    expected_recovery:
      - "儿童开始独立尝试或表达"
      - "儿童承担部分学习决策"
    research_codes:
      - "自主性支持"

  - strategy_id: "PARENT_AUTONOMY_SPACE"
    name: "归还儿童自主空间"
    states: ["high_risk", "dysregulation"]
    target_actor: "parent"
    repair_target: "autonomy_boundary"
    strategy_family: "autonomy_support"
    support_needs: ["autonomy_support"]
    task_processes: ["over_assistance"]
    approved_action_clause: "可以把下一步交还给孩子，让他先独立尝试或表达，再提供必要提示。"
    priority: 0
    use_when:
      - "家长长期接管、代答或过度纠正"
      - "儿童等待指令并缺少独立尝试"
    avoid_when:
      - "儿童已经获得并正在使用独立尝试空间"
